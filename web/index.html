<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Maintainer Board</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme-init.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-mark" aria-hidden="true"><span class="icon" data-icon="kanban" data-size="16"></span></span>
        <h1 class="brand">Maintainer Board</h1>
        <span class="topbar-sep" aria-hidden="true"></span>
        <div id="repo-switcher" class="repo-switcher">
          <button id="btn-repo-switcher" class="repo-trigger" type="button" aria-haspopup="menu" aria-expanded="false"
            title="Switch repository board or add a new repository">
            <span id="repo-context" class="repo-context mono"></span>
            <span id="repo-other-dot" class="repo-dot" hidden title="Other repositories have unread updates"></span>
            <span class="icon" data-icon="chevron-down" data-size="13"></span>
          </button>
          <div id="repo-menu" class="repo-menu" role="menu" hidden></div>
        </div>
        <span id="ao-status" class="pill pill-muted" title="AO daemon status">
          <span class="dot"></span><span class="pill-label">AO Connecting</span>
        </span>
        <button id="updates-pill" class="pill pill-warning pill-button" type="button" hidden
          title="Cards with unread GitHub updates. Click to show only those cards.">
          <span class="dot"></span><span class="pill-label">0 updates</span>
        </button>
      </div>
      <div class="topbar-right">
        <button id="btn-new" class="btn btn-primary" type="button" title="Create a task or start an agent session (N)">
          <span class="icon" data-icon="plus"></span><span>New Task / Session</span>
        </button>
        <button id="btn-import" class="btn" type="button" title="Import historical Copilot and Codex sessions through AO">
          <span class="icon" data-icon="history"></span><span>Import History</span>
        </button>
        <button id="btn-sync" class="btn" type="button" title="Sync every linked pull request and issue now">
          <span class="icon" data-icon="refresh"></span><span>Sync GitHub</span>
        </button>
        <button id="btn-columns" class="btn" type="button" title="Add, rename, recolor, reorder and delete columns">
          <span class="icon" data-icon="columns"></span><span>Columns</span>
        </button>
        <button id="btn-settings" class="btn" type="button" title="Configure GitHub identity, default repository, and agent permissions">
          <span class="icon" data-icon="settings"></span><span>Settings</span>
        </button>
        <span class="topbar-sep" aria-hidden="true"></span>
        <button id="btn-notify" class="btn btn-icon" type="button" aria-pressed="false"
          title="Browser notifications for new updates are off. Click to enable.">
          <span class="icon" data-icon="bell-off"></span>
        </button>
        <button id="btn-theme" class="btn" type="button" title="Switch between dark and light theme">
          <span class="icon" data-icon="moon"></span><span id="theme-label">Dark</span>
        </button>
      </div>
    </header>

    <div class="filterbar" role="search">
      <div class="search-group">
        <label class="search" title="Searches titles, summaries, notes, #numbers, @authors, tags, AO session IDs and the text of session conversations">
          <span class="icon" data-icon="search"></span>
          <input id="search" type="search" autocomplete="off" spellcheck="false"
            placeholder="Search cards, session ID, chat text" aria-label="Search cards">
          <kbd>/</kbd>
        </label>
        <button id="btn-ai-search" class="btn btn-ai" type="button"
          title="AI Search: let the local AI find cards by meaning, including what was said in their conversations (Ctrl+Enter in the search box)">
          <span class="icon" data-icon="sparkles"></span><span>AI Search</span>
        </button>
        <button id="btn-search-clear" class="btn btn-ghost" type="button" hidden title="Clear the search">
          <span class="icon" data-icon="x"></span><span>Clear</span>
        </button>
      </div>
      <div id="filter-category" class="segmented" role="group" aria-label="Category filter">
        <button type="button" data-value="" class="active">All</button>
        <button type="button" data-value="PR_REVIEW">PR Review</button>
        <button type="button" data-value="ISSUE">Issue</button>
        <button type="button" data-value="DEV">Dev</button>
        <button type="button" data-value="DESIGN">Design</button>
        <button type="button" data-value="TRIAGE">Triage</button>
      </div>
      <div id="filter-agent" class="segmented" role="group" aria-label="Agent filter">
        <button type="button" data-value="" class="active">All Agents</button>
        <button type="button" data-value="copilot">Copilot</button>
        <button type="button" data-value="codex">Codex</button>
      </div>
      <label class="filter-select" title="Show only cards whose pull request or issue was opened by this author">
        <span class="icon" data-icon="user"></span>
        <select id="filter-author" class="select" aria-label="Author filter">
          <option value="">All Authors</option>
        </select>
      </label>
      <label class="filter-select" title="Sort cards within each column (pinned cards always stay on top)">
        <span class="icon" data-icon="sort"></span>
        <select id="filter-sort" class="select" aria-label="Sort order">
          <option value="manual">Manual Order</option>
          <option value="recent">Recent Activity</option>
          <option value="unread">Unread First</option>
        </select>
      </label>
      <div class="toggles">
        <button id="toggle-compact" class="toggle" type="button" aria-pressed="false"
          title="Compact all columns into dense 2-line rows (or toggle per column in each column header)">Compact</button>
        <button id="toggle-updates" class="toggle" type="button" aria-pressed="false">Updates Only</button>
        <button id="toggle-done" class="toggle" type="button" aria-pressed="true">Show Done</button>
        <button id="toggle-orchestrator" class="toggle" type="button" aria-pressed="false"
          title="Create and show cards for AO orchestrator sessions">Show Orchestrator</button>
      </div>
      <span id="card-count" class="card-count mono"></span>
    </div>

    <div id="search-banner" class="search-banner" role="status" hidden></div>

    <main id="board" class="board" aria-label="Kanban board">
      <div class="board-loading">Loading board</div>
    </main>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Maintainer Board needs JavaScript.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
