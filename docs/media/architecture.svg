<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 426" width="920" height="426" role="img" aria-label="Maintainer Board Architecture">
  <defs>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 10 1.5 L 1.5 5 L 10 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Clean light canvas so diagram stays crisp on both GitHub Light and Dark themes -->
  <rect x="2" y="2" width="916" height="422" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Row 1: Browser -->
  <g filter="url(#shadow)">
    <rect x="240" y="24" width="440" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <text x="460" y="49" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0f172a">Browser</text>
  <text x="460" y="70" text-anchor="middle" class="font-sans" font-size="12" fill="#475569">Localhost  ·  SSH Port Forward  ·  Tailscale</text>

  <!-- Arrow: Browser <-> Maintainer Board -->
  <line x1="460" y1="88" x2="460" y2="128" stroke="#64748b" stroke-width="1.75" marker-start="url(#arrow-up)" marker-end="url(#arrow-down)"/>
  <text x="474" y="112" class="font-mono" font-size="11.5" fill="#475569">HTTP + SSE (:3012)</text>

  <!-- Row 2: Maintainer Board -->
  <g filter="url(#shadow)">
    <rect x="40" y="132" width="840" height="106" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.75"/>
  </g>
  <text x="64" y="159" class="font-sans" font-size="15.5" font-weight="700" fill="#1e1b4b">Maintainer Board</text>
  <rect x="720" y="141" width="136" height="24" rx="12" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="788" y="157" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#3730a3">Single Go Binary</text>

  <!-- Inner modules -->
  <rect x="64" y="174" width="248" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="188" y="195" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#1e293b">Embedded Web UI</text>
  <text x="188" y="212" text-anchor="middle" class="font-sans" font-size="11.5" fill="#64748b">Kanban · Live Chat · Search</text>

  <rect x="336" y="174" width="248" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="460" y="195" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#1e293b">SQLite &amp; Sync Engine</text>
  <text x="460" y="212" text-anchor="middle" class="font-sans" font-size="11.5" fill="#64748b">board.db · Auto-Triage · SSE</text>

  <rect x="608" y="174" width="248" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="732" y="195" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#1e293b">Native Agent Runtime</text>
  <text x="732" y="212" text-anchor="middle" class="font-sans" font-size="11.5" fill="#64748b">On-Demand Sessions · 2-Way Sync</text>

  <!-- Arrows: Maintainer Board <-> Local Native Backends -->
  <line x1="175" y1="242" x2="175" y2="294" stroke="#64748b" stroke-width="1.75" marker-start="url(#arrow-up)" marker-end="url(#arrow-down)"/>
  <text x="187" y="272" class="font-mono" font-size="11" fill="#475569">stdio JSON-RPC</text>

  <line x1="460" y1="242" x2="460" y2="294" stroke="#64748b" stroke-width="1.75" marker-start="url(#arrow-up)" marker-end="url(#arrow-down)"/>
  <text x="472" y="272" class="font-mono" font-size="11" fill="#475569">stdio JSON-RPC</text>

  <line x1="745" y1="242" x2="745" y2="294" stroke="#64748b" stroke-width="1.75" marker-start="url(#arrow-up)" marker-end="url(#arrow-down)"/>
  <text x="757" y="272" class="font-mono" font-size="11" fill="#475569">CLI subprocess</text>

  <!-- Row 3: Backend Cards -->
  <!-- Card 1: Codex CLI -->
  <g filter="url(#shadow)">
    <rect x="40" y="298" width="270" height="104" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="175" y="324" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="700" fill="#064e3b">Codex CLI</text>
  <text x="175" y="344" text-anchor="middle" class="font-mono" font-size="12" fill="#047857">codex app-server</text>
  <line x1="62" y1="358" x2="288" y2="358" stroke="#a7f3d0" stroke-width="1"/>
  <text x="175" y="376" text-anchor="middle" class="font-mono" font-size="11" fill="#065f46">~/.codex/sessions</text>
  <text x="175" y="392" text-anchor="middle" class="font-sans" font-size="11" fill="#047857">Shared Session IDs &amp; Terminal Sync</text>

  <!-- Card 2: Copilot CLI -->
  <g filter="url(#shadow)">
    <rect x="325" y="298" width="270" height="104" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  </g>
  <text x="460" y="324" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="700" fill="#0c4a6e">Copilot CLI</text>
  <text x="460" y="344" text-anchor="middle" class="font-mono" font-size="12" fill="#0369a1">copilot --acp</text>
  <line x1="347" y1="358" x2="573" y2="358" stroke="#bae6fd" stroke-width="1"/>
  <text x="460" y="376" text-anchor="middle" class="font-mono" font-size="11" fill="#075985">~/.copilot/session-state</text>
  <text x="460" y="392" text-anchor="middle" class="font-sans" font-size="11" fill="#0369a1">Shared Session IDs &amp; Terminal Sync</text>

  <!-- Card 3: GitHub CLI -->
  <g filter="url(#shadow)">
    <rect x="610" y="298" width="270" height="104" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <text x="745" y="324" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="700" fill="#78350f">GitHub CLI</text>
  <text x="745" y="344" text-anchor="middle" class="font-mono" font-size="12" fill="#b45309">gh pr / issue / api</text>
  <line x1="632" y1="358" x2="858" y2="358" stroke="#fde68a" stroke-width="1"/>
  <text x="745" y="376" text-anchor="middle" class="font-sans" font-size="11.5" fill="#92400e">PRs · Issues · Inline Threads</text>
  <text x="745" y="392" text-anchor="middle" class="font-sans" font-size="11" fill="#b45309">Review State · CI · Prow Labels</text>
</svg>
